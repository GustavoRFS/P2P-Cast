[package]
name = "p2pcast-native-broadcast"
version = "0.1.0"
description = "Native P2P-Cast sender: encodes the capture once and serves every viewer over PeerJS + WebRTC"
edition = "2021"
publish = false

[dependencies]
async-trait = "0.1"
bytes = "1"
fast_image_resize = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
log = "0.4"
openh264 = "0.9"
opus = "0.4"
rtc = { version = "0.21.1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
webrtc = "0.21.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Variant",
] }

[dev-dependencies]
env_logger = "0.11"
