plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.p2pcast'
version = '1.0.0'

android {
  namespace "expo.modules.p2pcastnative"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

// Same stack as the original Compose client (android/app): Stream's WebRTC build, OkHttp for the
// PeerJS signaling socket, and the kotlinx JSON element API (no compiler plugin needed).
dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  implementation "io.getstream:stream-webrtc-android:1.3.10"
  implementation "com.squareup.okhttp3:okhttp:5.5.0"
  implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
}
